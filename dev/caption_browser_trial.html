<!doctype html><style>body{margin:0;background:#111;color:white}iframe{width:100%;height:85vh}button#run{position:fixed;top:0;left:0;z-index:100;padding:12px}pre{white-space:pre-wrap}</style><iframe src="/en/index.html?trial=expressive-2"></iframe><button id="run">Run exact-file trial</button><pre id="report">Ready</pre><script>
const frame=document.querySelector('iframe'),report=document.querySelector('#report');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function runTrial(){try{report.textContent='Running';
const w=frame.contentWindow,d=w.document;const captionTexts=[];const proto=w.CanvasRenderingContext2D.prototype,fill=proto.fillText;proto.fillText=function(text,...args){captionTexts.push(text);return fill.call(this,text,...args)};d.querySelector('#productVideoCaptions').click();
w.addEventListener('error',e=>report.textContent+='\nERROR '+e.message);
async function select(id,url,name,type){const blob=await(await fetch(url)).blob();const dt=new w.DataTransfer();dt.items.add(new w.File([blob],name,{type}));const input=d.getElementById(id);input.files=dt.files;input.dispatchEvent(new w.Event('change',{bubbles:true}));await wait(1500);}
await select('captionVideoFile','/trial-video.mp4','video.mp4','video/mp4');
await select('captionTranscriptFile','/trial.srt','trial.srt','text/plain');
const effect=new URLSearchParams(location.search).get('effect');if(effect){d.getElementById('captionEffect').value=effect;d.getElementById('captionEffect').dispatchEvent(new w.Event('change'));}const treatment=new URLSearchParams(location.search).get('treatment');if(treatment){d.getElementById('captionTreatment').value=treatment;d.getElementById('captionTreatment').dispatchEvent(new w.Event('change'));}const ui=w.J.captionWorkbench,v=ui.media.current.video;const renderTimes=[],render=ui.preview.renderCaptions;ui.preview.renderCaptions=(...args)=>{const start=performance.now();try{return render(...args)}finally{renderTimes.push(performance.now()-start)}};v.muted=true;await v.play();await wait(2500);v.pause();const seek=new URLSearchParams(location.search).get('time');if(seek!==null){await new Promise(resolve=>{v.addEventListener('seeked',resolve,{once:true});v.currentTime=Number(seek)});await wait(100);}
const c=d.getElementById('captionPreview'),rect=c.getBoundingClientRect(),pixels=c.getContext('2d').getImageData(0,0,c.width,c.height).data;
const bounds=d.getElementById('captionPreviewFrame').getBoundingClientRect();if(rect.height>bounds.height||rect.width>bounds.width)throw new Error('Preview canvas exceeds its visible frame');if(!captionTexts.length)throw new Error('No subtitle text was drawn');if(!ui.preview.diagnostics.callbacks)throw new Error('Playback frames did not advance');report.textContent=JSON.stringify({result:'PASS',renderTimes,captionTexts:[...new Set(captionTexts)],status:d.getElementById('captionStatus').textContent,duration:v.duration,time:v.currentTime,ready:v.readyState,video:[v.videoWidth,v.videoHeight],canvas:[c.width,c.height],rect:{x:rect.x,y:rect.y,width:rect.width,height:rect.height},frame:d.getElementById('captionPreviewFrame').getBoundingClientRect().toJSON(),diagnostics:ui.preview&&ui.preview.diagnostics,segments:ui.store.project.segments.length,nonBlack:pixels.filter((v,i)=>i%4!==3&&v>10).length},null,2);
}catch(e){report.textContent=e.stack}}; document.querySelector('#run').onclick=runTrial; frame.addEventListener('load',runTrial);
</script>
